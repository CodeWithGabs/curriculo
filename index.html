<style>
/* Layout: dark night stage. Hero = name left, glowing orb with orbiting stack logos center, role right; then about, career timeline with a glowing line, stack "balls", projects, contact */
:root{
  --bg:#0B080C; --bg2:#120E14; --ink:#EAE5EC; --muted:#9A92A0; --line:#2A2330;
  --accent:#C2A4FF; --violet:#7F40FF; --pink:#FB8DFF; --ball:#EEE9F1;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none;transition:color .2s}
a:hover{color:var(--accent)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ambient glow */
.blob{position:fixed;width:340px;height:340px;border-radius:50%;background:var(--pink);box-shadow:inset -50px 40px 50px rgba(84,0,255,.6);filter:blur(70px);opacity:.55;pointer-events:none;z-index:0}
.blob.a{top:-170px;left:-170px;animation:spin 9s linear infinite}
.blob.b{top:45%;right:-220px;opacity:.35;animation:spin 11s linear infinite reverse}
@keyframes spin{to{rotate:360deg}}
main,header.nav,footer{position:relative;z-index:1}

/* cursor */
.cursor{position:fixed;top:-25px;left:-25px;width:50px;height:50px;border-radius:50%;background:#E6C3FF;box-shadow:0 0 30px #AF83FF;mix-blend-mode:difference;pointer-events:none;z-index:50;transition:transform .25s ease-out,width .25s,height .25s;display:none}
@media (pointer:fine){.cursor{display:block}}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:28px}
.logo-txt{font-weight:700;font-size:15px;letter-spacing:.04em}
.nav nav{display:flex;gap:28px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px}
.lang button{font:500 12px/1 var(--sans);letter-spacing:.1em;padding:7px 11px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav-r{display:flex;align-items:center;gap:28px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;min-height:640px;padding-block:24px 64px}
.intro h2{color:var(--accent);font-size:clamp(18px,2vw,26px);font-weight:300;letter-spacing:.08em}
.intro h1{font-size:clamp(34px,4.6vw,62px);line-height:.98;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin-top:8px}
.role{justify-self:end}
.role h3{color:var(--accent);font-size:clamp(18px,2vw,26px);font-weight:300;letter-spacing:.08em}
.role .big{font-size:clamp(34px,4.6vw,62px);line-height:1;font-weight:600;text-transform:uppercase;letter-spacing:.02em;margin-top:6px}
.rot{display:block;height:1.05em;overflow:hidden;color:#C481FF}
.rot span{display:block;animation:up .6s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:13px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:#3DDC97;box-shadow:0 0 10px #3DDC97}

/* orbit */
.orbit{--s:min(440px,78vw);position:relative;width:var(--s);height:var(--s)}
.core{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3E8FF 0%,#C2A4FF 22%,#7F40FF 55%,#2A0E4F 100%);box-shadow:0 0 80px rgba(170,66,255,.55),0 0 160px rgba(251,141,255,.25);display:grid;place-items:center}
.core b{font-size:calc(var(--s)*.12);font-weight:700;color:#fff;letter-spacing:-.02em;text-shadow:0 2px 20px rgba(60,0,120,.5)}
.ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(194,164,255,.18);animation:spin 40s linear infinite}
.ring.inner{inset:14%;animation-duration:28s;animation-direction:reverse}
.planet{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;transform:rotate(var(--a)) translate(calc(var(--s)/2)) rotate(calc(var(--a)*-1))}
.ring.inner .planet{transform:rotate(var(--a)) translate(calc(var(--s)*.36)) rotate(calc(var(--a)*-1))}
.planet span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--ball);padding:9px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:spin 40s linear infinite reverse}
.ring.inner .planet span{animation-duration:28s;animation-direction:normal}
.planet img{width:100%;height:100%;object-fit:contain}

/* section titles */
section{padding-block:110px}
.title{font-size:clamp(40px,6vw,76px);line-height:1;font-weight:400;text-transform:uppercase;text-align:center;letter-spacing:.01em;margin-bottom:64px}
.grad{background:linear-gradient(0deg,var(--violet),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title b{font-weight:600}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:48px;align-items:start}
.kicker{font-size:15px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent)}
.about p{font-size:clamp(22px,2.4vw,32px);line-height:1.25;font-weight:600;letter-spacing:.005em}
.about p span{color:var(--muted);font-weight:400}

/* what I do */
.do{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:72px}
.card{position:relative;padding:32px;border:1px dashed rgba(194,164,255,.35);border-radius:4px;background:linear-gradient(180deg,rgba(194,164,255,.05),transparent);transition:background .3s,border-color .3s}
.card:hover{border-color:var(--accent);background:linear-gradient(180deg,rgba(194,164,255,.12),transparent)}
.card h3{font-size:clamp(28px,3vw,40px);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.card h4{font-size:13px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:6px 0 16px}
.card p{color:var(--muted);font-size:15px;max-width:48ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pills span{font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}

/* career timeline */
.career{position:relative;max-width:1000px;margin:0 auto}
.career::before{content:"";position:absolute;left:50%;top:-40px;bottom:0;width:3px;transform:translateX(-50%);background:linear-gradient(to top,#AA42FF 20%,var(--accent) 50%,transparent 95%)}
.career .dot{position:absolute;left:50%;bottom:0;width:10px;height:10px;border-radius:50%;transform:translate(-50%,50%);background:#AA42FF;box-shadow:0 0 5px 2px #D29BFF,0 0 15px 8px #D097FF,0 0 110px 20px #F2C0FF;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 5px 2px #D29BFF}to{box-shadow:0 0 5px 2px #D29BFF,0 0 15px 8px #D097FF,0 0 110px 20px #F2C0FF}}
.job{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:80px;margin-bottom:70px}
.job-l{display:flex;justify-content:space-between;gap:24px;align-items:start}
.job h4{font-size:clamp(20px,2.2vw,30px);line-height:1.1;font-weight:500}
.job h5{font-size:17px;font-weight:400;color:var(--accent);margin-top:8px}
.job .yr{font-size:clamp(28px,3.4vw,46px);font-weight:500;line-height:1;white-space:nowrap}
.job p{font-size:14.5px;font-weight:300;line-height:1.6;color:#CFC8D4}

/* stack balls */
.stack{display:grid;gap:44px}
.sg h4{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:400;text-align:center;margin-bottom:22px}
.balls{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 22px}
.ball{display:flex;flex-direction:column;align-items:center;gap:10px;width:86px;font-size:12.5px;text-align:center;color:var(--muted);line-height:1.2}
.ball .orb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,var(--ball) 55%,#CFC6D8);display:grid;place-items:center;padding:15px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset -6px -8px 14px rgba(127,64,255,.18);animation:bob 4s ease-in-out infinite;animation-delay:var(--d);transition:transform .3s,box-shadow .3s}
.ball:hover .orb{transform:scale(1.12);box-shadow:0 10px 40px rgba(170,66,255,.5),inset -6px -8px 14px rgba(127,64,255,.18)}
.ball:hover{color:var(--ink)}
.orb img{width:100%;height:100%;object-fit:contain}
.orb .t{font-weight:700;font-size:13px;color:#2A0E4F}
@keyframes bob{50%{translate:0 -7px}}

/* projects */
.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.work{padding:32px 28px 36px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:background .3s}
.work::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#A87CFF;filter:blur(70px);opacity:0;top:var(--y,50%);left:var(--x,50%);transform:translate(-50%,-50%);transition:opacity .4s;pointer-events:none}
.work:hover::after{opacity:.28}
.work > *{position:relative;z-index:1}
.work .sec{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent)}
.work h3{font-size:22px;font-weight:600;line-height:1.2}
.work p{font-size:14.5px;color:var(--muted)}
.work .tech{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.work .tech span{width:30px;height:30px;border-radius:50%;background:var(--ball);display:grid;place-items:center;padding:6px}
.work .tech img{width:100%;height:100%;object-fit:contain}

/* contact */
.contact h2{font-size:clamp(40px,6vw,72px);font-weight:400;text-transform:uppercase;margin-bottom:44px}
.cflex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.cbox h4{font-size:14px;font-weight:500;opacity:.6;margin-bottom:10px}
.cbox .v{font-size:clamp(17px,1.7vw,22px);border-bottom:1px solid #6b6270;overflow-wrap:anywhere;display:inline-block;margin-bottom:12px}
.copy{font:500 12px/1 var(--sans);letter-spacing:.08em;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;margin-left:8px;vertical-align:middle}
.copy:hover{color:var(--ink);border-color:var(--accent)}
.sign{font-size:clamp(18px,2vw,23px);line-height:1.3}
.sign span{color:var(--accent)}
footer{padding-block:40px 60px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}


/* meus projetos (produtos autorais) */
.prods{display:grid;gap:120px}
.prod{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:56px;align-items:center}
.prod:nth-child(even) .prod-media{order:-1}
.prod-k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.prod h3{font-size:clamp(34px,4vw,54px);line-height:1;font-weight:600;letter-spacing:-.01em;margin:10px 0 6px}
.prod .tag{font-size:clamp(17px,1.6vw,20px);color:var(--ink);font-weight:500;margin-bottom:16px}
.prod .desc{color:var(--muted);font-size:15px;max-width:54ch}
.prod ul{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px;color:#CFC8D4}
.prod li{display:flex;gap:10px}
.prod li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.prod-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:22px}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c,#3DDC97);box-shadow:0 0 8px var(--c,#3DDC97)}
.visit{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg)}
.visit:hover{background:var(--accent);color:var(--bg)}
.prod .pills{margin-top:16px}
.prod-media{position:relative;padding:0 0 36px}
.browser{border-radius:12px;overflow:hidden;background:#17121b;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(127,64,255,.15)}
.browser .bar{display:flex;gap:6px;align-items:center;padding:10px 12px;background:#1d1722;border-bottom:1px solid var(--line)}
.browser .bar i{width:9px;height:9px;border-radius:50%;background:#3a3140}
.browser .bar span{margin-left:10px;font-size:11.5px;color:var(--muted);background:#120e15;border-radius:6px;padding:3px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shot{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top}
.phone{position:absolute;right:-14px;bottom:0;width:27%;min-width:110px;border-radius:26px;padding:7px;background:#0d0a10;border:1px solid #3a3140;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.phone .shot img{aspect-ratio:390/844;border-radius:20px}
.thumbs{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;padding-right:28%}
.thumbs button{width:72px;height:46px;padding:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#17121b;cursor:pointer;opacity:.65;transition:opacity .2s,border-color .2s}
.thumbs button.m{width:30px}
.thumbs button:hover,.thumbs button[aria-pressed="true"]{opacity:1;border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:top}
.lb{position:fixed;inset:0;z-index:60;background:rgba(8,6,10,.92);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:min(1400px,100%);max-height:88vh;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.lb p{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
.lb .x{position:absolute;top:16px;right:18px;font:500 13px var(--sans);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}

@media (max-width:980px){
  .prod{grid-template-columns:minmax(0,1fr);gap:36px}
  .prod:nth-child(even) .prod-media{order:0}
  .prods{gap:90px}
  .hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;min-height:0}
  .role{justify-self:center}
  .nav nav{display:none}
  .about,.do,.cflex{grid-template-columns:minmax(0,1fr)}
  .works{grid-template-columns:repeat(2,minmax(0,1fr))}
  .career::before{left:4px}
  .career .dot{left:5px}
  .job{grid-template-columns:minmax(0,1fr);gap:14px;padding-left:36px}
  section{padding-block:80px}
}
@media (max-width:620px){
  .phone{right:-4px;width:30%;min-width:0;border-radius:18px;padding:5px}
  .phone .shot img{border-radius:14px}
  .thumbs{padding-right:32%}
  .works{grid-template-columns:minmax(0,1fr)}
  .planet{width:36px;height:36px;margin:-18px}
  .planet span{padding:7px}
  .job-l{flex-direction:column;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cursor{display:none!important}}
</style>

function renderProducts(){
  const t = T[lang];
  document.getElementById("prods").innerHTML = PRODUCTS.map(p => {
    const c = p[lang];
    const d = p.shots.findIndex(s => s[1] === "d"), m = p.shots.findIndex(s => s[1] === "m");
    const shot = (i, cls) => `<button class="shot" type="button" data-p="${p.id}" data-i="${i}" aria-label="${c.alt[i]}"><img src="img/${p.shots[i][0]}" alt="${c.alt[i]}" loading="lazy" ${cls === "d" ? 'width="1440" height="900"' : 'width="390" height="844"'}></button>`;
    return `<article class="prod" id="p-${p.id}">
      <div>
        <span class="prod-k">${c.k}</span>
        <h3>${p.name || p.id.charAt(0).toUpperCase() + p.id.slice(1)}</h3>
        <p class="tag">${c.tag}</p>
        <p class="desc">${c.desc}</p>
        <ul>${c.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        <div class="pills">${p.stack.map(s => `<span>${s}</span>`).join("")}</div>
        <div class="prod-meta"><span class="badge" style="--c:${p.status.c}"><i></i>${p.status[lang]}</span>${p.url ? `<a class="visit" href="${p.url}" target="_blank" rel="noopener">${t.visit} ↗</a>` : ""}</div>
      </div>
      <div class="prod-media">
        <div class="browser"><div class="bar"><i></i><i></i><i></i><span>${p.host}</span></div><div class="main-d">${d >= 0 ? shot(d, "d") : ""}</div></div>
        ${m >= 0 ? `<div class="phone"><div class="main-m">${shot(m, "m")}</div></div>` : ""}
        <div class="thumbs">${p.shots.map(([f, k], i) => `<button type="button" class="${k}" data-p="${p.id}" data-i="${i}" aria-pressed="${i === d || i === m}" aria-label="${c.alt[i]}"><img src="img/${f}" alt="" loading="lazy"></button>`).join("")}</div>
      </div>
    </article>`;
  }).join("");
}

const lb = document.createElement("div");
lb.className = "lb"; lb.hidden = true;
lb.innerHTML = `<button class="x" type="button"></button><img alt=""><p></p>`;
document.body.appendChild(lb);
const closeLb = () => { lb.hidden = true; };
lb.addEventListener("click", e => { if (e.target.tagName !== "IMG") closeLb(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

document.getElementById("prods").addEventListener("click", e => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  const p = PRODUCTS.find(x => x.id === b.dataset.p), i = +b.dataset.i, [file, kind] = p.shots[i];
  if (b.closest(".thumbs")) {
    // miniatura: troca a imagem principal (computador ou celular)
    const art = b.closest(".prod"), slot = art.querySelector(kind === "d" ? ".main-d" : ".main-m");
    const img = slot.querySelector("img"), btn = slot.querySelector("button");
    img.src = `img/${file}`; img.alt = p[lang].alt[i]; btn.dataset.i = i; btn.setAttribute("aria-label", p[lang].alt[i]);
    art.querySelectorAll(`.thumbs button.${kind}`).forEach(t => t.setAttribute("aria-pressed", String(t === b)));
    return;
  }
  lb.querySelector("img").src = `img/${file}`; lb.querySelector("img").alt = p[lang].alt[i];
  lb.querySelector("p").textContent = p[lang].alt[i];
  lb.querySelector(".x").textContent = T[lang].close;
  lb.hidden = false;
});

const outer = ["php","java","python","angular","flutter","laravel","react","docker","postgresql","vuejs"];
const inner = ["aws","redis","typescript","nodejs","spring","mysql"];
const planets = (list) => list.map((k,i) => `<div class="planet" style="--a:${(360/list.length)*i}deg"><span><img src="${ICONS[k]}" alt=""></span></div>`).join("");
document.getElementById("ringOuter").innerHTML = planets(outer);
document.getElementById("ringInner").innerHTML = planets(inner);

let lang = "pt";
const label = n => T[lang].names[n] || n;

function render(){
  const t = T[lang];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t[el.dataset.i18n]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("career").innerHTML = t.jobs.map(([role,co,yr,txt]) =>
    `<div class="job"><div class="job-l"><div><h4>${role}</h4><h5>${co}</h5></div><span class="yr">${yr}</span></div><p>${txt}</p></div>`).join("") + `<span class="dot"></span>`;
  let d = 0;
  document.getElementById("stackEl").innerHTML = STACK.map((techs,i) =>
    `<div class="sg"><h4>${t.groups[i]}</h4><div class="balls">${techs.map(([n,k]) => {
      d += .37;
      const inside = ICONS[k] ? `<img src="${ICONS[k]}" alt="">` : `<span class="t">${k}</span>`;
      return `<div class="ball"><span class="orb" style="--d:-${(d%4).toFixed(2)}s">${inside}</span>${label(n)}</div>`;
    }).join("")}</div></div>`).join("");
  renderProducts();
  document.getElementById("works").innerHTML = WORKS.map(w => {
    const [sec,title,txt] = w[lang];
    return `<article class="work"><span class="sec">${sec}</span><h3>${title}</h3><p>${txt}</p>${
      w.tags.length ? `<div class="tech">${w.tags.map(k=>`<span><img src="${ICONS[k]}" alt="${k}"></span>`).join("")}</div>` : ""}</article>`;
  }).join("");
}

}));

// rotating word
const rot = document.getElementById("rot");
let rotI = 0;
function setRot(){ rot.innerHTML = `<span>${T[lang].rot[rotI]}</span>`; }
setRot();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => { rotI = (rotI+1) % T[lang].rot.length; setRot(); }, 2200);

// cursor + hover glow on project cards
const cur = document.getElementById("cursor");
addEventListener("pointermove", e => { cur.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; });
document.getElementById("works").addEventListener("pointermove", e => {
  const w = e.target.closest(".work"); if (!w) return;
  const r = w.getBoundingClientRect();
  w.style.setProperty("--x", (e.clientX - r.left) + "px");
  w.style.setProperty("--y", (e.clientY - r.top) + "px");
});

document.querySelectorAll(".copy").forEach(btn => btn.addEventListener("click", () => {
  const el = document.getElementById(btn.dataset.copy);
  const done = () => { btn.textContent = T[lang].copied; setTimeout(()=>{btn.textContent=T[lang].copy},1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = T[lang].selected; };
  try { navigator.clipboard.writeText(el.textContent.trim()).then(done, fallback); } catch(e){ fallback(); }
}));
